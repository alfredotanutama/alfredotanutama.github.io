# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: alfredotanutama/alfredotanutama.github.io
  branch: main

media_folder: /assets
public_folder: /assets

collections:
  - name: site
    label: Site
    files:
      - name: content
        label: Page content
        file: content.json
        fields:
          - { name: page_title, label: Browser tab title, widget: string }
          - { name: meta_description, label: Search and link preview description, widget: text }
          - { name: host_label, label: "Header bar: left text", widget: string }
          - { name: status_code, label: "Header bar: status badge", widget: string }

          - { name: headline, label: Headline, widget: string, hint: "The angle brackets are added automatically" }
          - { name: boot_line, label: Small line above the headline, widget: string }
          - { name: lede, label: "Intro: first half", widget: string }
          - { name: lede_emphasis, label: "Intro: highlighted part", widget: string }
          - { name: lede_tail, label: "Intro: last half", widget: string }
          - { name: primary_cta, label: Main button text, widget: string }
          - { name: resume_cta, label: Resume button text, widget: string }
          - { name: resume_file, label: Resume PDF, widget: file, required: false }
          - { name: portrait, label: Portrait photo, widget: image, required: false }
          - { name: portrait_caption, label: Caption under the photo, widget: string, required: false }

          - { name: about_heading, label: "Section heading: about", widget: string }
          - name: about
            label: About paragraphs
            widget: list
            fields:
              - { name: text, label: Paragraph, widget: text }

          - { name: credentials_heading, label: "Section heading: credentials", widget: string }
          - { name: stack_title, label: Stack heading, widget: string }
          - { name: stack_note, label: Stack note, widget: string }
          - name: stack
            label: Stack items
            widget: list
            fields:
              - { name: item, label: Item, widget: string }

          - { name: methods_title, label: Methods heading, widget: string }
          - { name: methods_note, label: Methods note, widget: string }
          - name: methods
            label: Method items
            widget: list
            fields:
              - { name: item, label: Item, widget: string }

          - { name: record_title, label: Record heading, widget: string }
          - { name: record_note, label: Record note, widget: string }
          - name: record
            label: Certificates and education
            widget: list
            summary: "{{fields.year}} {{fields.title}}"
            fields:
              - { name: year, label: Year or range, widget: string }
              - { name: title, label: Name, widget: string }
              - { name: issuer, label: Issuer or school, widget: string, required: false }
              - { name: url, label: Verification link, widget: string, required: false }

          - { name: contact_heading, label: "Section heading: contact", widget: string }
          - { name: contact_intro, label: Contact intro line, widget: string }
          - name: links
            label: Contact links
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Shown value, widget: string }
              - { name: url, label: URL, widget: string }

          - { name: archive_label, label: Archive button text, widget: string, required: false }
          - { name: archive_url, label: Archive button link, widget: string, required: false, hint: "Leave empty to hide the button" }

          - { name: footer, label: Footer text, widget: string }
